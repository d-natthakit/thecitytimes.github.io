name: Daily issue

on:
  schedule:
    - cron: "17 21 * * *"   # 04:17 Bangkok time (GitHub cron uses UTC)
    - cron: "27 23 * * *"   # 06:27 Bangkok: backup run. Builds the issue if it is missing,
                            # or rewrites it if 04:17 had to use the fallback model
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date YYYY-MM-DD (leave empty for today)"
        required: false
      force:
        description: "Rebuild even if the issue already exists"
        type: boolean
        default: false
      provider:
        description: "AI provider"
        type: choice
        options: [gemini, anthropic]
        default: gemini

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-issue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build today's issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROVIDER: ${{ inputs.provider || vars.PROVIDER || 'gemini' }}
          ISSUE_DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          args=()
          if [ "$SCHEDULE" = "27 23 * * *" ]; then args+=(--upgrade); fi
          if [ -n "$ISSUE_DATE" ]; then args+=(--date "$ISSUE_DATE"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python scripts/build.py "${args[@]}"

      - name: Keep the rejected draft for checking
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-draft
          path: data/failed/
          if-no-files-found: ignore

      - name: Save to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data/issues data/drafts
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Daily run $(TZ=Asia/Bangkok date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
