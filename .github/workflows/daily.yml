name: Daily issue

on:
  schedule:
    # GitHub may start scheduled runs 1–3 hours late, so they start early.
    # For exact times, use an outside timer (see README: "เวลารันไม่ตรง").
    - cron: "5 20 * * *"    # 03:05 Bangkok: main run
    - cron: "5 22 * * *"    # 05:37 Bangkok: backup run. Builds the issue if it is missing,
                            # or rewrites it if the main run had to use the fallback model.
                            # Keep BACKUP_CRON below exactly the same as this line.
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date YYYY-MM-DD (leave empty for today)"
        required: false
      force:
        description: "Rebuild even if the issue already exists"
        type: boolean
        default: false
      mode:
        description: "normal = build if missing · upgrade = also rewrite a fallback-model issue"
        type: choice
        options: [normal, upgrade]
        default: normal
      provider:
        description: "AI provider"
        type: choice
        options: [gemini, anthropic]
        default: gemini

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-issue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build today's issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROVIDER: ${{ inputs.provider || vars.PROVIDER || 'gemini' }}
          ISSUE_DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          BACKUP_CRON: "37 21 * * *"
        run: |
          args=()
          if [ "$SCHEDULE" = "$BACKUP_CRON" ] || [ "$MODE" = "upgrade" ]; then args+=(--upgrade); fi
          if [ -n "$ISSUE_DATE" ]; then args+=(--date "$ISSUE_DATE"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python scripts/build.py "${args[@]}"

      - name: Keep the rejected draft for checking
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-draft
          path: data/failed/
          if-no-files-found: ignore

      - name: Save to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data/issues data/drafts
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Daily run $(TZ=Asia/Bangkok date +%F)"
            # in case the repo was edited on GitHub while this run was working
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
