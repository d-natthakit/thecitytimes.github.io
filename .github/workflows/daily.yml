# THE CITY TIMES — builds the day's issue and publishes it on GitHub Pages.
name: Daily issue

on:
  schedule:
    # GitHub cron uses UTC (Bangkok = UTC+7) and may start runs late when busy.
    # For exact times, use an outside timer (README: "เวลารันไม่ตรง").
    - cron: "10 20 * * *"   # 03:10 Bangkok — main run
    - cron: "15 22 * * *"   # 05:15 Bangkok — backup run: builds the issue if it is missing,
                            # or rewrites it if the main run had to use the fallback model.
                            # Keep BACKUP_CRON below exactly the same as this line.
  workflow_dispatch:        # "Run workflow" button (and outside timers)
    inputs:
      date:
        description: "Issue date YYYY-MM-DD (leave empty for today)"
        required: false
      force:
        description: "Rebuild even if the issue already exists"
        type: boolean
        default: false
      mode:
        description: "normal = build if missing · upgrade = also rewrite a fallback-model issue"
        type: choice
        options: [normal, upgrade]
        default: normal
      provider:
        description: "AI provider"
        type: choice
        options: [gemini, anthropic]
        default: gemini

permissions:
  contents: write           # save the issue to the repository
  pages: write              # publish the website
  id-token: write

concurrency:                # never two runs at the same time
  group: daily-issue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # includes up to 15 min of waiting for a busy Gemini
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build today's issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROVIDER: ${{ inputs.provider || vars.PROVIDER || 'gemini' }}
          ISSUE_DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
          MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
          BACKUP_CRON: "15 22 * * *"
        run: |
          args=()
          if [ "$SCHEDULE" = "$BACKUP_CRON" ] || [ "$MODE" = "upgrade" ]; then args+=(--upgrade); fi
          if [ -n "$ISSUE_DATE" ]; then args+=(--date "$ISSUE_DATE"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python scripts/build.py "${args[@]}"

      - name: Keep the rejected draft for checking
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-draft
          path: data/failed/
          if-no-files-found: ignore

      # Runs even after a failure, so finished articles (data/drafts) are kept for the next run.
      - name: Save to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data/issues data/drafts
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Daily run $(TZ=Asia/Bangkok date +%F)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"   # in case the repo was edited meanwhile
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
