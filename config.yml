# ─────────────────────────────────────────────────────────────
#  THE CITY TIMES — settings
#  Everything you may want to change lives in this file.
# ─────────────────────────────────────────────────────────────

paper_name: THE CITY TIMES
timezone: Asia/Bangkok
start_date: 2026-10-30        # Issue 1. Saved issues before this date are ignored and removed from the site.

# ── AI ───────────────────────────────────────────────────────
# provider: gemini (free tier) | anthropic (paid API) | mock (offline test)
# The PROVIDER environment variable / workflow input overrides this.
provider: gemini
models:
  gemini:
    # Primary models are tried in turn, with growing waits while Google is busy.
    # Tip: put the model with the highest "Requests per day" in AI Studio first.
    primary: [gemini-3.8-flash, gemini-3.6-flash]
    # Used only when the primary models stay busy for retry_wait_minutes.
    fallback: [gemini-3.5-flash-lite]
  anthropic: [claude-sonnet-5-5, claude-haiku-5-5]

retry_wait_minutes: 15        # max total waiting per run for busy primary models (HTTP 503)
max_requests_per_run: 12      # hard cap on AI requests per run (a normal run uses 2)
max_repairs_per_step: 1       # extra request per step, only for critical problems
request_timeout: 240          # seconds to wait for one AI answer

# ── News ─────────────────────────────────────────────────────
news:
  max_age_hours: 36           # ignore older feed items
  repeat_window_days: 3       # skip stories similar to ones used in the last N days
  max_candidates: {world: 30, thailand: 25}
  # Feeds that fail are skipped and reported in the run log.
  feeds:
    world:
      - {name: BBC News, url: "https://feeds.bbci.co.uk/news/world/rss.xml"}
      - {name: The Guardian, url: "https://www.theguardian.com/world/rss"}
      - {name: Al Jazeera, url: "https://www.aljazeera.com/xml/rss/all.xml"}
      - {name: NPR, url: "https://feeds.npr.org/1004/rss.xml"}
      - {name: DW, url: "https://rss.dw.com/rdf/rss-en-all"}
    thailand:
      - {name: Bangkok Post, url: "https://www.bangkokpost.com/rss/data/thailand.xml"}
      - {name: Bangkok Post Business, url: "https://www.bangkokpost.com/rss/data/business.xml"}
      - {name: Thai PBS World, url: "https://www.thaipbsworld.com/feed/"}
      - {name: Khaosod English, url: "https://www.khaosodenglish.com/feed/"}
      - {name: The Nation Thailand, url: "https://www.nationthailand.com/rss"}

# ── Weekly rotation (weekday in Bangkok time) ────────────────
#   feature  : theme of the day's Feature article
#   opinion  : Real English format — two_takes | say_it_better
#   setting  : situation type for Say It Better
#   activity : Language Lab exercise
#   trap     : Thai Speaker's Trap category (shown inside Real English)
rotation:
  Sun: {feature: "Business / Money",        opinion: say_it_better, setting: services & customers, activity: Context clue challenge, trap: "Confusing word pairs (e.g. bored/boring)"}
  Mon: {feature: "Health & Wellbeing",      opinion: say_it_better, setting: workplace email,      activity: Collocation match,      trap: "Articles (a / an / the)"}
  Tue: {feature: "Tech & Science",          opinion: two_takes,     setting: "",                   activity: Gap fill,               trap: Prepositions}
  Wed: {feature: "Arts & Entertainment",    opinion: say_it_better, setting: meetings & calls,     activity: Word forms,             trap: Tenses & time expressions}
  Thu: {feature: "Home / Environment",      opinion: two_takes,     setting: "",                   activity: Synonym choice,         trap: Countable/uncountable & plurals}
  Fri: {feature: "Food & Travel",           opinion: say_it_better, setting: social & small talk,  activity: Mini crossword clues,   trap: Direct translation from Thai}
  Sat: {feature: "Cultures / Digital Life", opinion: two_takes,     setting: "",                   activity: Odd one out,            trap: Word order & questions}

# ── Other Languages ──────────────────────────────────────────
# Language by issue number: Issue 1 = first item, then round and round.
languages: [German, Spanish, French, Italian]
# Everyday theme for the phrases; each language moves to the next theme every round.
phrase_themes: [greetings & small talk, at a café, ordering food, shopping, getting around town,
  asking for directions, at the hotel, at work, making plans, the weather, feelings, at the doctor,
  numbers & time, family & friends, thanks & compliments, saying sorry, on the phone, at the market,
  celebrations, hobbies & sport]

# ── Vocabulary memory ────────────────────────────────────────
review_days: [1, 3, 7, 21]    # ★ words taught N days ago come back as ↺ review words
avoid_repeat_days: 30         # a ★ word is not taught again within N days
